apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: inference-service
  namespace: argus
spec:
  hosts:
    - inference-service.argus.svc.cluster.local
  http:
    # roteamento por header para testes de canary dirigido
    - match:
        - headers:
            x-argus-canary:
              exact: "true"
      route:
        - destination:
            host: inference-service.argus.svc.cluster.local
            subset: v2
    # tráfego normal: canary 90/10
    - route:
        - destination:
            host: inference-service.argus.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: inference-service.argus.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 2s
      retries:
        attempts: 2
        perTryTimeout: 800ms
        retryOn: 5xx,reset,connect-failure

name: Enterprise v2

# Exercita a camada de arquitetura enterprise (v2): serviços de domínio
# (DDD), messaging, read models CQRS, robustness gate, contratos de Data
# Product e BDD. Os testes @pytest.mark.integration (Kafka/RabbitMQ reais)
# rodam no job `integration`, contra brokers subidos como services do runner.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "services/**"
      - "platform/**"
      - "ml-platform/**"
      - "data-platform/data-products/**"
      - "tests/bdd/**"
      - ".github/workflows/enterprise-v2.yml"
  push:
    branches: [main, master]

concurrency:
  group: entv2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (services · messaging · read models · data products · BDD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install fastapi "uvicorn[standard]" pydantic grpcio grpcio-tools \
                      jsonschema pyyaml pytest behave scikit-learn numpy pandas
      - name: Python tests
        run: |
          pytest -q \
            services/inference-service/tests \
            platform/messaging/tests \
            platform/read_models/tests \
            ml-platform/adversarial-evaluation/tests \
            data-platform/data-products
      - name: Data Product contracts
        run: python data-platform/data-products/validate.py
      - name: BDD
        run: behave tests/bdd

  integration:
    name: Integration (Kafka + RabbitMQ reais)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redpanda:
        image: redpandadata/redpanda:v24.2.7
        ports: ["9092:9092"]
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install fastapi pydantic grpcio jsonschema pyyaml pytest \
                      kafka-python pika scikit-learn numpy
      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
        run: pytest -q -m integration services/inference-service/tests

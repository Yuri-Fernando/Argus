name: CI

# Primary pull-request gate — see ROADMAP.md Sprint 0 acceptance criteria:
# `make install && make up && make seed && make test` must succeed with zero
# manual steps. This workflow exercises the install/lint/test slice of that
# chain on every PR; `data-quality.yml` covers the seed+dq slice separately
# so a broken GX suite doesn't block unrelated PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test (unit + data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: make install
        run: make install

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: Upload pytest cache (debugging aid on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache
          retention-days: 3

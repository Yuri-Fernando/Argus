name: dbt

# Builds and tests the dbt/MetricFlow semantic layer implementation
# (ARCHITECTURE.md §11, ADR-005, built Sprint 8) against a disposable,
# CI-only Snowflake schema — never against a persistent dev/staging/prod
# schema. The target is named `ci` in profiles.yml (not committed; rendered
# from secrets below) and points at
# `CUSTOMER_INTELLIGENCE.CI_PR_<run_id>`, a schema created at the start of
# the job and dropped at the end regardless of outcome, so concurrent PRs
# never collide and nothing CI creates outlives the job.

on:
  pull_request:
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"

concurrency:
  group: dbt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  CI_SCHEMA: CI_PR_${{ github.run_id }}

jobs:
  dbt-build-test:
    name: dbt build + test (CI-safe schema)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires repo secrets: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER,
    # SNOWFLAKE_PASSWORD (or key-pair), SNOWFLAKE_ROLE, SNOWFLAKE_WAREHOUSE.
    # Skips gracefully (does not fail the build) when secrets are absent —
    # e.g. on forked-repo PRs that can't access repo secrets — so external
    # contributors aren't blocked by infrastructure they can't reach.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Check Snowflake secrets are configured
        id: secrets-check
        run: |
          if [ -z "${{ secrets.SNOWFLAKE_ACCOUNT }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbt (Snowflake adapter)
        if: steps.secrets-check.outputs.configured == 'true'
        run: pip install -e ".[dbt]"

      - name: dbt deps
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: dbt
        run: dbt deps || true # no packages.yml yet is not an error

      - name: Create disposable CI schema
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          pip install snowflake-connector-python
          python - <<'PY'
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ["SNOWSQL_ACCOUNT"],
              user=os.environ["SNOWSQL_USER"],
              password=os.environ["SNOWSQL_PWD"],
          )
          schema = os.environ["CI_SCHEMA"]
          conn.cursor().execute(f"CREATE SCHEMA IF NOT EXISTS CUSTOMER_INTELLIGENCE.{schema}")
          PY

      - name: dbt build (run + test)
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: CUSTOMER_INTELLIGENCE
          SNOWFLAKE_SCHEMA: ${{ env.CI_SCHEMA }}
        run: |
          dbt build --target ci

      - name: Drop disposable CI schema
        if: always() && steps.secrets-check.outputs.configured == 'true'
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          python - <<'PY'
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ["SNOWSQL_ACCOUNT"],
              user=os.environ["SNOWSQL_USER"],
              password=os.environ["SNOWSQL_PWD"],
          )
          schema = os.environ["CI_SCHEMA"]
          conn.cursor().execute(f"DROP SCHEMA IF EXISTS CUSTOMER_INTELLIGENCE.{schema}")
          PY

      - name: Skipped — no Snowflake secrets configured
        if: steps.secrets-check.outputs.configured == 'false'
        run: echo "SNOWFLAKE_ACCOUNT secret not set (expected on forked-repo PRs) — dbt build/test skipped, not failed."

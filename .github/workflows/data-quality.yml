name: Data Quality

# Sprint 3 acceptance criteria (ROADMAP.md): this workflow must run the GX
# suite on every PR touching lakehouse/** or data_quality/**, and it must
# FAIL the build when a Checkpoint fails — a red DQ gate is the point, not
# a bug. `make seed` here always runs against the `local` volume profile
# (data/synthetic/config.yaml) so the suite completes in CI-reasonable time;
# the `cloud` profile is only ever exercised against a real Databricks
# cluster, never in GitHub Actions.

on:
  pull_request:
    paths:
      - "lakehouse/**"
      - "data_quality/**"
      - "data/synthetic/**"
      - ".github/workflows/data-quality.yml"

concurrency:
  group: dq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  great-expectations:
    name: GX Checkpoint (local profile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: make install
        run: make install

      - name: make seed (local profile — small volumes, CI-sized)
        run: make seed

      - name: make dq (GX Checkpoint — fails the build on breach)
        run: make dq

      - name: Publish GX Data Docs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gx-data-docs
          path: data_quality/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify quarantine test still passes
        run: pytest -q tests/data/test_dq_quarantine.py

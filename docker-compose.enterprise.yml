# Stack local da camada enterprise v2 — event backbone + work queue + DB.
# Complementa o docker-compose.yml (MinIO/Postgres/MLflow/GX do pipeline de dados).
#
#   docker compose -f docker-compose.enterprise.yml up -d
#
# Depois disso, os testes marcados @pytest.mark.integration passam a rodar
# (KafkaBus/RabbitBus contra brokers reais) e `python platform/messaging/demo.py`
# pode ser apontado para localhost:9092 / localhost:5672.

services:
  redpanda:                       # Kafka-compatible, leve, sem ZooKeeper
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"     # UI: guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-services:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus_services
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 10s
      timeout: 5s
      retries: 10

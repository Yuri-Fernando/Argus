# Service for eci-dashboard — exposed as a NodePort so a demo cluster can be reached without an
# Ingress controller; switch to ClusterIP + Ingress for a real environment (not decided here).
apiVersion: v1
kind: Service
metadata:
  name: eci-dashboard
  labels:
    app: eci-dashboard
    component: dashboard
spec:
  type: NodePort
  selector:
    app: eci-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30851

[project]
name = "enterprise-customer-intelligence-platform"
version = "2.2.0"
description = "Enterprise Customer Intelligence Platform — Lakehouse, MDM, ML, GenAI, MCP, Governance"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Core data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    # Synthetic data generation
    "faker>=25.0",
    "kagglehub>=0.3",
    # Data quality
    "great-expectations>=1.0",
    # Entity resolution
    "jellyfish>=1.0",          # Jaro-Winkler / Levenshtein
    "scikit-learn>=1.4",
    "networkx>=3.3",
    # ML
    "xgboost>=2.0",
    "shap>=0.45",
    "mlflow>=2.13",
    # API / Agents / MCP
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "langgraph>=0.1",
    # Observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
pyspark = ["pyspark>=3.5", "delta-spark>=3.2"]
dbt = ["dbt-core>=1.8", "dbt-snowflake>=1.8", "dbt-databricks>=1.8"]
docs-pdf = ["reportlab>=4.2"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]
# Local-first RAG stack (ADR-011) + multi-model LLM gateway (ADR-012) + Agno-based Knowledge
# Ingestion Agent (ADR-011). Note: DeepSeek and other OpenAI-compatible providers reuse the
# existing `openai` SDK client pointed at a different base_url (see agents/llm_gateway/router.py)
# — no separate provider SDK needed, only `google-genai` is a genuinely new client shape.
genai-extra = [
    "crawl4ai>=0.5",
    "docling>=2.0",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "agno>=1.0",
    "google-genai>=0.1",
    # Pillow: renders the synthetic "scanned" fiscal documents (ADR-015) that give the VLM
    # parsing path (rag/local_stack/document_parser.py::DoclingVlmDocumentParser) something real
    # to parse. Lives here, not in core `dependencies`, for the same reason as the rest of this
    # group: `make seed`'s CSV/ground-truth generation must keep working without it — image
    # rendering degrades gracefully (data/synthetic/generators/fiscal.py) if it's absent.
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

name: churn-scores
domain: analytics
owner: analytics-domain-team
description: Score de churn por cliente, produzido pelo ml-platform e servido via tópico + tabela.
version: 1.0.0
output_ports:
  - type: kafka_topic
    location: model.prediction.created
  - type: delta_table
    location: gold.churn_scores
sla:
  freshness: 5m
  availability: 99.5%
  latency_p95_ms: 300
schema:
  - { name: customer_id, type: string,  nullable: false }
  - { name: model_id,    type: string,  nullable: false }
  - { name: score,       type: double,  nullable: false, range: [0.0, 1.0] }
  - { name: high_risk,   type: boolean, nullable: false }
  - { name: scored_at,   type: timestamp, nullable: false }
quality_rules:
  - rule: not_null
    columns: [customer_id, model_id, score, high_risk, scored_at]
  - rule: range
    column: score
    min: 0.0
    max: 1.0
lineage:
  upstream: [customer-360, gold.feature_store]
access_policy:
  classification: internal
  masking: []

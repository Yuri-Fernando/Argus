# dbt project config — one of the three semantic layer implementations
# (ARCHITECTURE.md §11, ADR-005), built in Sprint 8. See dbt/README.md for
# the folder layout this file declares, and docs/semantic-dictionary.md for
# the canonical metric definitions every model here mirrors.

name: "customer_intelligence"
version: "1.0.0"
config-version: 2

# Adapter is chosen per-target in profiles.yml (not committed — see
# ~/.dbt/profiles.yml locally, or DBT_PROFILES_DIR in CI, ml/README.md-style
# secrets handling). Models are written to be adapter-agnostic wherever
# possible so the same project builds against dbt-databricks or
# dbt-snowflake — see "Target warehouses" in dbt/README.md.
profile: "customer_intelligence"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

# Every model must be documented and have at least a not_null/unique test on
# its primary key — enforced by dbt/tests/ + CI (.github/workflows/dbt.yml),
# not just convention.
require-dbt-version: [">=1.8.0", "<2.0.0"]

vars:
  # Mirrors data/synthetic/config.yaml's seed, so any dbt seed/snapshot that
  # needs deterministic sample data stays consistent with the rest of the
  # platform.
  synthetic_data_seed: 42

models:
  customer_intelligence:
    # models/staging — 1:1 light cleanup views over Silver/Gold sources.
    # Materialized as views: cheap, always fresh, no storage cost for a
    # layer that does no heavy aggregation.
    staging:
      +materialized: view
      +schema: staging

    # models/intermediate — joins/business logic building blocks. Views by
    # default; promoted to ephemeral for pure pass-through helpers used by
    # exactly one downstream model.
    intermediate:
      +materialized: view
      +schema: intermediate

    # models/marts — final marts + MetricFlow semantic models (Revenue,
    # Orders, AOV, Churn, CLV, NPS...). Tables, since these are what Power
    # BI and the semantic-layer parity test (tests/data/test_metric_parity.py)
    # query directly and must be fast and stable to snapshot.
    marts:
      +materialized: table
      +schema: marts

seeds:
  customer_intelligence:
    +schema: seeds

snapshots:
  customer_intelligence:
    +target_schema: snapshots
